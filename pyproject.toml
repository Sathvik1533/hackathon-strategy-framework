[tool.poetry]
name = "hackathon-strategy-framework"
version = "1.0.0"
description = "Production-grade hackathon acceleration framework and pre-ready template ecosystem"
authors = ["Sathvik <24r21a05hr@mlrit.ac.in>"]
readme = "README.md"
packages = [{include = "app", from = "backend/src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
pgvector = "^0.3.6"
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
redis = "^5.2.0"
celery = "^5.4.0"
langchain = "^0.3.7"
langchain-openai = "^0.2.7"
langgraph = "^0.2.45"
mcp = "^1.0.0"
httpx = "^0.28.0"
pyjwt = {extras = ["crypto"], version = "^2.9.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
psycopg-pool = "^3.2.3"
flashrank = "^0.2.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
ragas = "^0.2.6"
datasets = "^3.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["B008", "BLE001", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = [".", "backend", "backend/src"]
